name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anisdev_test
          POSTGRES_USER: anisdev
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: cle-de-ci-non-secrete
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      POSTGRES_DB: anisdev_test
      POSTGRES_USER: anisdev
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy strict
        run: mypy apps config

      - name: Migrations non générées manquantes
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=80

      # La CI ne validait que `settings.dev` : les réglages qui comptent vraiment
      # n'étaient jamais chargés. `check --deploy` les exerce et échoue sur un socle mou.
      - name: Contrôle de déploiement sur les réglages de production
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: anis.dev
          DJANGO_ADMIN_PATH: chemin-de-ci
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DEFAULT_FROM_EMAIL: contact@anis.dev
        run: python manage.py check --deploy --fail-level WARNING

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    env:
      API_INTERNAL_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: vitest
        run: npm run test:cov

      - name: build
        run: npm run build

      # Une CSP à nonce sur une page prérendue en statique bloque tous ses scripts.
      # Le build doit rester intégralement dynamique tant que le nonce est la seule
      # défense : `○ (Static)` dans la sortie de build est une régression.
      - name: Aucune route prérendue en statique
        run: |
          if npm run build 2>&1 | grep -qE "^○|\(Static\)"; then
            echo "::error::une route est prérendue en statique : la CSP à nonce la casse"
            exit 1
          fi

  images:
    name: Les images Docker se construisent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: api
        run: docker build -t anisdev-api ./api
      - name: web
        run: docker build -t anisdev-web ./web

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Le .env ne doit jamais être suivi par git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env est commité"
            exit 1
          fi

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
