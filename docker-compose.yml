services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Aucun port publié : seuls api et web joignent la base, par le réseau interne.

  api:
    build: ./api
    env_file: .env
    # Rien de sensible à la configuration n'est forcé ici : un `environment:` l'emporte
    # sur `env_file:`, et c'est par ce chemin qu'un déploiement retomberait en réglages
    # de développement. Le module de settings vient de .env, et de lui seul.
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Django n'est PAS exposé publiquement (CLAUDE.md §3). En développement on
    # le publie sur 127.0.0.1 uniquement, pour pouvoir déboguer à la main.
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "mkdir -p /app/.preuves-privees &&
             python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Purge des preuves 90 jours après examen (§4.5). Une boucle quotidienne suffit
  # en développement ; Celery beat arrivera à l'étape 10 pour la prod multi-worker.
  purge:
    build: ./api
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - ./api:/app
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "while true; do python manage.py purger_preuves; sleep 86400; done"

  web:
    build: ./web
    # `API_INTERNAL_URL` vient de .env, comme le reste. Le redéclarer ici créait deux
    # sources pour une même valeur, dont une invisible depuis .env.
    env_file: .env
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
